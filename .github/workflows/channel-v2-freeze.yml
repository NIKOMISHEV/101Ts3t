name: Freeze each channel layer before its first test (channel-v2)

on:
  push:
    branches: [main]
    paths: ['channel-v2/**', 'channel-support-v2/**', 'channels-v2/*/README.md', '.github/workflows/channel-v2-*.yml']
  workflow_dispatch:

concurrency:
  group: channel-record-publication
  cancel-in-progress: false

permissions: {}

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r channel-v2/requirements.lock
      - run: python -m unittest discover -s channel-v2/tests -v
      - run: python -m unittest discover -s channel-support-v2/tests -v

  freeze:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        channel: [mcp, http-api, acp, ucp, a2a, browser]
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      CHANNEL: ${{ matrix.channel }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Prepare the layer commitment, or verify the existing one
        id: prepare
        run: python channel-support-v2/publish.py prepare-freeze
      - name: Attest the pre-event layer manifest
        if: steps.prepare.outputs.fresh == 'true'
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: channels-v2/${{ matrix.channel }}/freeze/manifest.json
          predicate-type: https://dothat.quest/attestations/channel-layer/v2
          predicate-path: channels-v2/${{ matrix.channel }}/freeze/predicate.json
      - name: Verify and preserve the public Sigstore bundle
        if: steps.prepare.outputs.fresh == 'true'
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: python channel-support-v2/publish.py preserve-freeze
      - name: Commit the new layer commitment without rewriting history
        if: steps.prepare.outputs.fresh == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "channels-v2/$CHANNEL/freeze"
          git commit -m "Preserve the $CHANNEL channel layer commitment"
          git pull --rebase origin main
          git push origin HEAD:main
