name: Test route-v1 offline verification

on:
  pull_request:
    paths: ['route-v1/**', 'workflow-support/**', '.github/workflows/**', 'records/**', 'attestations/**', 'TEST-SPECIFICATION.md', '.gitattributes']
  push:
    branches: [main]
    paths: ['route-v1/**', 'workflow-support/**', '.github/workflows/**', 'records/**', 'attestations/**', 'TEST-SPECIFICATION.md', '.gitattributes']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r route-v1/requirements.lock
      - run: python workflow-support/release.py check-history
      - run: python -m unittest discover -s route-v1/tests -v
      - run: python route-v1/check_signature_mutation.py
      - run: python -m unittest discover -s workflow-support/tests -v
