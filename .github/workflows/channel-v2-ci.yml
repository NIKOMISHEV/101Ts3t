name: Test channel-v2 offline verification (channel-v2)

on:
  pull_request:
    paths: ['channel-v2/**', 'channel-support-v2/**', 'channels-v2/**', '.github/workflows/channel-v2-*.yml']
  push:
    branches: [main]
    paths: ['channel-v2/**', 'channel-support-v2/**', 'channels-v2/**', '.github/workflows/channel-v2-*.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r channel-v2/requirements.lock
      - run: python -m unittest discover -s channel-v2/tests -v
      - run: python -m unittest discover -s channel-support-v2/tests -v
