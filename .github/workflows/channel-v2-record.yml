name: Record an ended channel run (channel-v2)

on:
  workflow_dispatch:
    inputs:
      challenge_id:
        description: 'Ended challenge with a declared channel (qst_ followed by 32 lowercase hex characters)'
        required: true
        type: string

concurrency:
  group: channel-record-publication
  cancel-in-progress: false

permissions: {}

jobs:
  record:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      CHALLENGE_ID: ${{ inputs.challenge_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r channel-v2/requirements.lock
      - name: Authenticate the layer, verify the declaration timestamp, replay the public evidence
        id: prepare
        run: python channel-support-v2/publish.py prepare-run
      - name: Attest the run record, whatever its result
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: channels-v2/${{ steps.prepare.outputs.channel }}/runs/${{ inputs.challenge_id }}/manifest.json
          predicate-type: https://dothat.quest/attestations/channel-run/v2
          predicate-path: channels-v2/${{ steps.prepare.outputs.channel }}/runs/${{ inputs.challenge_id }}/predicate.json
      - name: Verify and preserve the run attestation
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          CHANNEL: ${{ steps.prepare.outputs.channel }}
        run: python channel-support-v2/publish.py preserve-run
      - name: Publish the new record without replacing earlier evidence
        shell: bash
        env:
          CHANNEL: ${{ steps.prepare.outputs.channel }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "channels-v2/$CHANNEL/runs/$CHALLENGE_ID"
          git commit -m "Record the $CHANNEL channel run $CHALLENGE_ID"
          git pull --rebase origin main
          git push origin HEAD:main
