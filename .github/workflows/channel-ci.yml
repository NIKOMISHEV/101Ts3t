name: Test channel-v1 offline verification

on:
  pull_request:
    paths: ['channel-v1/**', 'channel-support/**', 'channels/**', '.github/workflows/channel-*.yml']
  push:
    branches: [main]
    paths: ['channel-v1/**', 'channel-support/**', 'channels/**', '.github/workflows/channel-*.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r channel-v1/requirements.lock
      - run: python -m unittest discover -s channel-v1/tests -v
      - run: python -m unittest discover -s channel-support/tests -v
