name: Verify and anchor a new route-qualified purchase

on:
  workflow_dispatch:
    inputs:
      challenge_id:
        description: 'Fresh completed challenge (qst_ followed by 32 lowercase hex characters)'
        required: true
        type: string
      expected_protocol:
        description: 'Protocol to prove for this single purchase'
        required: true
        type: choice
        options:
          - bd-commerce/1
          - acp/2026-04-17
          - ucp/2026-08-25
          - ucp/2026-04-08

concurrency:
  group: route-record-publication
  cancel-in-progress: false

permissions: {}

jobs:
  anchor:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      CHALLENGE_ID: ${{ inputs.challenge_id }}
      EXPECTED_PROTOCOL: ${{ inputs.expected_protocol }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r route-v1/requirements.lock
      - name: Authenticate pre-event commitment and replay only public signed evidence
        run: python workflow-support/release.py prepare-run
      - name: Attest only a successfully replayed production package
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: route-records/${{ inputs.challenge_id }}/manifest.json
          predicate-type: https://dothat.quest/attestations/route-qualified-commerce/v1
          predicate-path: route-records/${{ inputs.challenge_id }}/predicate.json
      - name: Verify and preserve the route attestation
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: python workflow-support/release.py preserve-run
      - name: Publish new record without replacing earlier evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "route-records/$CHALLENGE_ID"
          git commit -m "Preserve verified route-v1 evidence for $CHALLENGE_ID"
          git push origin HEAD:main
