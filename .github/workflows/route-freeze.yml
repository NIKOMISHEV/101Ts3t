name: Freeze route-v1 before a new purchase

on:
  push:
    branches: [main]
    paths: ['route-v1/**', 'workflow-support/**', '.github/workflows/route-*.yml', '.gitattributes']
  workflow_dispatch:

concurrency:
  group: route-record-publication
  cancel-in-progress: false

permissions: {}

jobs:
  freeze:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r route-v1/requirements.lock
      - run: python -m unittest discover -s route-v1/tests -v
      - run: python route-v1/check_signature_mutation.py
      - run: python -m unittest discover -s workflow-support/tests -v
      - name: Prepare immutable rules and verifier manifest
        id: prepare
        run: python workflow-support/release.py prepare-freeze
      - name: Attest the pre-event manifest
        if: steps.prepare.outputs.fresh == 'true'
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: route-attestations/v1/manifest.json
          predicate-type: https://dothat.quest/attestations/route-specification/v1
          predicate-path: route-attestations/v1/predicate.json
      - name: Verify and preserve the public Sigstore bundle
        if: steps.prepare.outputs.fresh == 'true'
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: python workflow-support/release.py preserve-freeze
      - name: Commit the new freeze without rewriting history
        if: steps.prepare.outputs.fresh == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- route-attestations/v1
          git commit -m 'Preserve verified route-v1 pre-event commitment'
          git push origin HEAD:main
